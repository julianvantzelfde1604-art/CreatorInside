name: Debug Bright Data Response

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Try the request and capture everything about the response
        shell: bash
        run: |
          echo "=== Apify Hashtag Scraper with resultsLimit=150 ===" > debug-output.txt
          curl -s -w "\n[HTTP_STATUS:%{http_code}]\n" \
            -X POST "https://api.apify.com/v2/acts/reGe1ST3OBgYZSsZJ/run-sync-get-dataset-items?token=${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"hashtags":["parentingtips"],"resultsLimit":150}' \
            -o response_body.json
          echo "HTTP status captured above."
          python3 -c "
import json
with open('response_body.json') as f:
    data = json.load(f)
print('Items returned:', len(data) if isinstance(data, list) else 'not a list')
if isinstance(data, list) and len(data) > 0:
    print('First item keys:', list(data[0].keys())[:10])
    unique_owners = set(p.get('ownerUsername') for p in data if p.get('ownerUsername'))
    print('Unique usernames found:', len(unique_owners))
" >> debug-output.txt
          cat debug-output.txt

      - name: Push the result so it can be read back
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout -B debug-output
          git add debug-output.txt
          git commit -m "Bright Data debug output"
          git push -f origin debug-output
