name: Debug Bright Data Response

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Try the request and capture everything about the response
        shell: bash
        run: |
          echo "=== Instagram Profiles - collect by URL (sync /scrape) ===" > debug-output.txt
          curl -s -w "\n[HTTP_STATUS:%{http_code}]\n" \
            -X POST "https://api.brightdata.com/datasets/v3/scrape?dataset_id=gd_l1vikfch901nx3by4&format=json" \
            -H "Authorization: Bearer ${{ secrets.BRIGHTDATA_KEY }}" \
            -H "Content-Type: application/json" \
            -d '[{"url":"https://www.instagram.com/mama.shocks"}]' \
            >> debug-output.txt 2>&1
          cat debug-output.txt

      - name: Push the result so it can be read back
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout -B debug-output
          git add debug-output.txt
          git commit -m "Bright Data debug output"
          git push -f origin debug-output
