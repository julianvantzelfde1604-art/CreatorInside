name: Debug Bright Data Response

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Try the request and capture everything about the response
        shell: bash
        run: |
          echo "=== Apify token verification endpoint ===" > debug-output.txt
          curl -s -w "\n[HTTP_STATUS:%{http_code}]\n" \
            "https://api.apify.com/v2/users/me?token=${{ secrets.APIFY_TOKEN }}" \
            >> debug-output.txt 2>&1
          cat debug-output.txt

      - name: Push the result so it can be read back
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout -B debug-output
          git add debug-output.txt
          git commit -m "Bright Data debug output"
          git push -f origin debug-output
