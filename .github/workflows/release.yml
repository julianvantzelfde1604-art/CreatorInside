name: Build and Release

# Runs automatically whenever a version tag (like v1.0.1) is pushed.
# Builds on GitHub's own Windows servers -- not a workaround, this is
# the standard, professional way Electron apps ship auto-updates.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish to GitHub Releases
        id: build
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder -w --publish always 2>&1 | tee build-log.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish the release (electron-builder creates it as a draft by default)
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Looking up release for tag: $TAG"
          RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Could not find a release for tag $TAG. Response was:"
            echo "$RELEASE_JSON"
            exit 1
          fi
          echo "Found release ID: $RELEASE_ID -- publishing it"
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d '{"draft": false}'

      - name: Push build log for inspection (only runs if the build failed)
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout -B build-log
          git add build-log.txt
          git commit -m "Build log for failed run ${{ github.run_id }}"
          git push -f origin build-log

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
